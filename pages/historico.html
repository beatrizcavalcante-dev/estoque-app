<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico — EstoqueApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <button class="menu-toggle" id="menu-toggle">
        <i data-lucide="menu"></i>
    </button>

    <aside id="sidebar">
        <div class="logo">
            <img src="../assets/stoque.png" alt="Stock Logo">
        </div>

        <nav>
            <a href="../index.html" class="nav-item">
                <i data-lucide="layout-dashboard"></i>
                Dashboard
            </a>
            <a href="produtos.html" class="nav-item">
                <i data-lucide="package"></i>
                Produtos
            </a>
            <a href="movimentacoes.html" class="nav-item">
                <i data-lucide="arrow-left-right"></i>
                Movimentações
            </a>
            <a href="historico.html" class="nav-item">
                <i data-lucide="clock"></i>
                Histórico
            </a>
        </nav>
    </aside>

    <main id="main-content">

        <header class="page-header">
            <h1>Histórico</h1>
            <p>Todas as movimentações registradas</p>
        </header>

    <!-- FILTROS -->
        <section class="filtros-section">
            <button class="btn-filtro active" data-filtro="todos">Todos</button>
            <button class="btn-filtro" data-filtro="entrada">Entradas</button>
            <button class="btn-filtro" data-filtro="saida">Saídas</button>
        </section>

    <!-- TABELA -->
        <section class="table-section" style="margin-top: 16px;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Tipo</th>
                        <th>Quantidade</th>
                        <th>Observação</th>
                        <th>Data</th>
                    </tr>
                </thead>
            <tbody id="tabela-historico"></tbody>
            </table>

      <!-- mensagem quando não há registros -->
            <div id="msg-vazio" style="display:none;">
                <p>Nenhuma movimentação encontrada.</p>
            </div>

        </section>

    </main>

  <script src="../js/app.js"></script>
  <script src="../js/historico.js"></script>
  <script>lucide.createIcons()</script>

</body>
</html>
