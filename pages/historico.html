<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico — EstoqueApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <button class="menu-toggle" id="menu-toggle">
        <i data-lucide="menu"></i>
    </button>

    <aside id="sidebar">
        <div class="logo">
            <div class="logo-text"><span>S</span>tock</div>
            <div class="logo-sub">sistema de estoque</div>
        </div>

        <nav>
            <a href="../index.html" class="nav-item">
                <i data-lucide="layout-dashboard"></i>
                Dashboard
            </a>
            <a href="produtos.html" class="nav-item">
                <i data-lucide="package"></i>
                Produtos
            </a>
            <a href="movimentacoes.html" class="nav-item">
                <i data-lucide="arrow-left-right"></i>
                Movimentações
            </a>
            <a href="historico.html" class="nav-item">
                <i data-lucide="clock"></i>
                Histórico
            </a>
        </nav>
        <div class="sidebar-footer">
            <p class="sidebar-contact">entre em contato</p>

            <div class="sidebar-links">
                <a href="https://www.linkedin.com/in/beatrizcavalcantee/" target="_blank" class="social-btn" title="LinkedIn">
                    <i data-lucide="briefcase"></i>
                </a>

                <a href="https://api.whatsapp.com/send/?phone=5511966049189" target="_blank" class="social-btn" title="WhatsApp">
                    <i data-lucide="message-circle"></i>
                </a>
            </div>
        </div>
    </aside>

    <main id="main-content">

        <header class="page-header">
            <h1>Histórico</h1>
            <p>Todas as movimentações registradas</p>
        </header>
        
        <section class="filtros-section">
            <button class="btn-filtro active" data-filtro="todos">Todos</button>
            <button class="btn-filtro" data-filtro="entrada">Entradas</button>
            <button class="btn-filtro" data-filtro="saida">Saídas</button>
        </section>
        
        <section class="table-section" style="margin-top: 16px;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Tipo</th>
                        <th>Quantidade</th>
                        <th>Observação</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody id="tabela-historico"></tbody>
            </table>
      
            <div id="msg-vazio" style="display:none;">
                <p>Nenhuma movimentação encontrada.</p>
            </div>
        </section>

        <footer class="footer">
            <p>Dev. <span>Beatriz Cavalcante</span></p>
        </footer>

    </main>

    <script src="../js/app.js"></script>
    <script src="../js/historico.js"></script>
    <script>lucide.createIcons()</script>

</body>
</html>
