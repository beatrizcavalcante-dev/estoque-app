<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos — EstoqueApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <button class="menu-toggle" id="menu-toggle">
        <i data-lucide="menu"></i>
    </button>
    
    <aside id="sidebar">
        <div class="logo">
            <img src="../assets/stoque.png" alt="Stock Logo">
        </div>

        <nav>
            <a href="../index.html" class="nav-item">
                <i data-lucide="layout-dashboard"></i>
                Dashboard
            </a>
            <a href="produtos.html" class="nav-item">
                <i data-lucide="package"></i>
                Produtos
            </a>
            <a href="movimentacoes.html" class="nav-item">
                <i data-lucide="arrow-left-right"></i>
                Movimentações
            </a>
            <a href="historico.html" class="nav-item">
                <i data-lucide="clock"></i>
                Histórico
            </a>
        </nav>
    </aside>

    <main id="main-content">

        <header class="page-header">
            <h1>Produtos</h1>
            <p>Cadastre e gerencie seus produtos</p>
        </header>

         <!-- FORMULÁRIO DE CADASTRO -->
        <section class="form-section">

            <div class="section-header">
                <h2>Novo Produto</h2>
            </div>

            <form id="form-produto">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome do Produto</label>
                        <input type="text" id="nome" placeholder="Ex: Caneta Azul">
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <select id="categoria">
                            <option value="">Selecione...</option>
                            <option value="Papelaria">Papelaria</option>
                            <option value="Informática">Informática</option>
                            <option value="Limpeza">Limpeza</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">

                    <div class="form-group">
                        <label for="quantidade">Quantidade Inicial</label>
                        <input type="number" id="quantidade" placeholder="0" min="0">
                    </div>

                    <div class="form-group">
                        <label for="estoque-minimo">Estoque Mínimo</label>
                        <input type="number" id="estoque-minimo" placeholder="0" min="0">
                    </div>
                </div>

                <input type="hidden" id="edit-index" value="-1">
                <button type="submit" class="btn-primary" id="btn-submit">Cadastrar Produto</button>
            </form>
        </section>
        <!-- TABELA DE PRODUTOS -->
        <section class="table-section" style="margin-top: 24px;">
            <div class="section-header search-header">
                <h2>Produtos Cadastrados</h2>
                <input type="text" id="busca" placeholder="Buscar produto...">
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Quantidade</th>
                        <th>Mínimo</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabela-produtos"></tbody>
            </table>
        </section>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/produtos.js"></script>
    <script>lucide.createIcons()</script>
    
</body>
</html>
