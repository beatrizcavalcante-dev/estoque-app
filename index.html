<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstoqueApp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="global.css">
</head>
<body>
    <aside id="sidebar">
        <div class="logo">EstoqueApp</div>

        <nav>
        <a href="index.html" class="nav-item active">Dashboard</a>
        <a href="pages/produtos.html" class="nav-item">Produtos</a>
        <a href="pages/movimentacoes.html" class="nav-item">Movimentações</a>
        <a href="pages/historico.html" class="nav-item">Histórico</a>
        </nav>
    </aside>
    
    <main id="main-content">

        <header class="page-header">
            <h1>Dashboard</h1>
            <p>Visão geral do estoque</p>
        </header>

    
        <!-- CARDS DE MÉTRICAS -->
    <section class="metrics-grid">

        <div class="metric-card">
            <span class="metric-label">Total de Produtos</span>
            <span class="metric-value" id="total-produtos">0</span>
        </div>

        <div class="metric-card">
            <span class="metric-label">Entradas do Mês</span>
            <span class="metric-value success" id="total-entradas">0</span>
        </div>

        <div class="metric-card">
            <span class="metric-label">Saídas do Mês</span>
            <span class="metric-value danger" id="total-saidas">0</span>
        </div>

        <div class="metric-card">
            <span class="metric-label">Alertas de Estoque</span>
            <span class="metric-value warning" id="total-alertas">0</span>
        </div>



    </section>








    </main>

    <script src="app.js"></script>
</body>
</html>
