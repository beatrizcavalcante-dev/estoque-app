<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstoqueApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <button class="menu-toggle" id="menu-toggle">
        <i data-lucide="menu"></i>
    </button>

    <aside id="sidebar">
        <div class="logo">
            <img src="assets/stoque.png" alt="Stock Logo">
        </div>

        <nav>
            <a href="index.html" class="nav-item active">
            <i data-lucide="layout-dashboard"></i>
            Dashboard
        </a>
        <a href="pages/produtos.html" class="nav-item">
            <i data-lucide="package"></i>
            Produtos
        </a>
        <a href="pages/movimentacoes.html" class="nav-item">
            <i data-lucide="arrow-left-right"></i>
            Movimentações
        </a>
        <a href="pages/historico.html" class="nav-item">
            <i data-lucide="clock"></i>
            Histórico
        </a>
        </nav>
    </aside>
    
    <main id="main-content">

        <header class="page-header">
            <h1>Dashboard</h1>
            <p>Visão geral do estoque</p>
        </header>

    
        <!-- CARDS DE MÉTRICAS -->
    <section class="metrics-grid">

        <div class="metric-card">
            <span class="metric-label">Total de Produtos</span>
            <span class="metric-value" id="total-produtos">0</span>
        </div>

        <div class="metric-card">
            <span class="metric-label">Entradas do Mês</span>
            <span class="metric-value success" id="total-entradas">0</span>
        </div>

        <div class="metric-card">
            <span class="metric-label">Saídas do Mês</span>
            <span class="metric-value danger" id="total-saidas">0</span>
        </div>

        <div class="metric-card">
            <span class="metric-label">Alertas de Estoque</span>
            <span class="metric-value warning" id="total-alertas">0</span>
        </div>
    </section>

    <!-- TABELA DE PRODUTOS -->
    <section class="table-section">

        <div class="section-header">
            <h2>Produtos</h2>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Quantidade</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabela-produtos"></tbody>
        </table>
    </section>
    </main>

    <script>lucide.createIcons()</script>
    <script src="js/app.js"></script>
</body>
</html>
